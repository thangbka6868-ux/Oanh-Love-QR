<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bí mật dành cho bạn ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="stars"></div>
<div id="hearts"></div>
<canvas id="fireworks"></canvas>
<div id="floating-text"></div>

<div class="container">

<h1>❤️ Xin chào ❤️</h1>

<p>Bạn vừa mở một bí mật...</p>

<button id="openBtn">
MỞ BÍ MẬT
</button>

<img
id="couplePhoto"
src="images/love.jpg"
alt="Love">

<h2 id="message"></h2>
<div id="answerBox" style="display:none; margin-top:30px;">

    <button id="yesBtn">💖 Em đồng ý</button>

    <button id="thinkBtn">😊 Cho em suy nghĩ thêm</button>

</div>

<h1 id="loveSuccess">
    💖 Từ hôm nay em là vợ tương lai của anh 💖
</h1>

</div>
<audio id="bgMusic" loop>
    <source src="music/love.mp3" type="audio/mpeg">
</audio>
<script src="script.js"></script>

</body>

</html>
